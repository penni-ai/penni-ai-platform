name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v1.6.0
        with:
          config-path: .gitleaks.toml

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Audit app dependencies
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Audit pipeline-service dependencies
        working-directory: services/pipeline-service
        run: |
          npm ci
          npm audit --audit-level=high
