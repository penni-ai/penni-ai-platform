name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  pipeline-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pipeline-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/pipeline-service/package-lock.json
      - run: npm ci
      - run: npm test

